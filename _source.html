/* ====== 과목 ======

const SUBJECTS = [

  { key: "history", name: "한국사",         minutes: 30,  count: 20, max: 50,  at: "14:50~15:20", color: "#7950f2" },
  { key: "tamgu1",  name: "탐구 1",         minutes: 30,  count: 20, max: 50,  at: "15:35~16:05", color: "#f76707" },

  { key: "lang2",   name: "제2외국어·한문", minutes: 40,  count: 30, max: 50,  at: "17:05~17:45", color: "#868e96" },
];
const subjectOf = (k) => SUBJECTS.find((s) => s.key === k) || SUBJECTS[0];

/* 탐구는 사람마다 고른 과목이 달라서 계정 설정에서 지정한다.
   지정하면 화면 곳곳의 "탐구 1" 자리에 그 과목 이름이 대신 나온다.

   App 이 설정을 읽을 때 함께 채운다. 값이 바뀌면 App 이 다시 그린다. */
const TAMGU_NAMES = { tamgu1: "", tamgu2: "" };
const applyTamguNames = (v) => {
  TAMGU_NAMES.tamgu1 = ((v && v.tamgu1) || "").trim();
  TAMGU_NAMES.tamgu2 = ((v && v.tamgu2) || "").trim();
};
const subjectName = (k) => TAMGU_NAMES[k] || subjectOf(k).name;

// 탐구에서 고를 수 있는 과목
const TAMGU_CHOICES = [
  { group: "사회탐구", items: ["생활과 윤리", "윤리와 사상", "한국지리", "세계지리", "동아시아사", "세계사", "경제", "정치와 법", "사회·문화"] },
  { group: "과학탐구", items: ["물리학Ⅰ", "화학Ⅰ", "생명과학Ⅰ", "지구과학Ⅰ", "물리학Ⅱ", "화학Ⅱ", "생명과학Ⅱ", "지구과학Ⅱ"] },
];

/* ====== 시험 카테고리 ======
   평가원과 교육청 시험은 누가 봐도 같으니 처음부터 깔아둔다.
   사설처럼 사람마다 다른 건 각자 추가해서 쓴다. 추가한 건 계정에 남는다. */
const BASE_CATEGORIES = [
  "3월 학력평가", "5월 학력평가", "6월 모의평가",
  "7월 학력평가", "9월 모의평가", "10월 학력평가", "수능",
];
const isBaseCat = (n) => BASE_CATEGORIES.indexOf(n) !== -1;

/* 저장은 합쳐진 이름 한 줄로 한다.
   평가원·교육청은 몇 년도 시험인지를 앞에 붙인다.
   이건 응시일과 다르다. 2026년에 2024년 기출을 풀 수 있으니 따로 받아야 한다.
   내가 만든 건 몇 회차인지를 뒤에 붙인다.
   "2024 6월 모의평가"  "이감 3회"
   (설명을 JSX 안에 주석으로 두면 컴파일 때 통째로 사라져서 여기 적는다) */
function composeExamName(p) {
  if (!p || !p.cat) return p && p.orphan ? p.orphan : "";
  if (isBaseCat(p.cat)) return (p.year ? p.year + " " : "") + p.cat;
  return p.cat + (p.round ? " " + p.round + "회" : "");
}
/* 합쳐진 이름을 도로 쪼갠다. 못 알아보면 orphan 으로 두고 그대로 보여준다 */
function parseExamName(name, myNames) {
  const s = String(name || "").trim();
  const none = { cat: "", year: "", round: "", orphan: "" };
  if (!s) return none;
  const withYear = s.match(/^(\d{4})\s+(.+)$/);
  if (withYear && isBaseCat(withYear[2])) return { cat: withYear[2], year: withYear[1], round: "", orphan: "" };
  if (isBaseCat(s)) return { cat: s, year: "", round: "", orphan: "" };
  const withRound = s.match(/^(.+?)\s+(\d+)회$/);
  if (withRound && (myNames || []).indexOf(withRound[1]) !== -1)
    return { cat: withRound[1], year: "", round: withRound[2], orphan: "" };
  if ((myNames || []).indexOf(s) !== -1) return { cat: s, year: "", round: "", orphan: "" };
  return { cat: "", year: "", round: "", orphan: s };
}
// 기출은 옛날 것도 푼다. 올해부터 거슬러 내려간다
const EXAM_YEARS = (() => {
  const now = new Date().getFullYear();
  const out = [];
  for (let y = now; y >= 2005; y--) out.push(String(y));
  return out;
})();
/* ====== 등급컷으로 백분위 잡기 ======
   사설 모의고사는 표본이 적어 백분위를 못 내고 예상 등급컷만 주는 곳이 많다.
   등급별 누적 비율은 정해져 있으니, 등급컷 표와 내 원점수가 있으면
   내가 어느 등급 어디쯤인지 비례로 잡을 수 있다.

   1등급컷에 딱 걸치면 상위 4% 이므로 백분위 96. 아래는 그 값들이다. */
const CUT_PERCENTILES = [96, 89, 77, 60, 40, 23, 11, 4];
// 영어와 한국사는 절대평가라 백분위 자체가 없다
const hasPercentile = (subjectKey) => subjectKey !== "english" && subjectKey !== "history";

function estimatePercentile(cuts, rawScore, subjectKey) {
  if (!hasPercentile(subjectKey)) return null;
  if (!Array.isArray(cuts) || rawScore === null || rawScore === undefined || rawScore === "") return null;
  const R = Number(rawScore);
  if (!isFinite(R)) return null;

  const pts = [];
  cuts.forEach((c, i) => {
    const v = Number(c);
    if (c === null || c === undefined || c === "" || !isFinite(v)) return;
    if (i < CUT_PERCENTILES.length) pts.push({ s: v, p: CUT_PERCENTILES[i] });
  });
  if (!pts.length) return null;
  pts.sort((a, b) => a.s - b.s);

  // 0점은 백분위 0, 만점은 100 으로 양끝을 잡아두고 그 사이를 잇는다
  const max = subjectOf(subjectKey).max;
  const all = [{ s: 0, p: 0 }];
  pts.forEach((q) => { if (q.s > all[all.length - 1].s) all.push(q); });
  if (max > all[all.length - 1].s) all.push({ s: max, p: 100 });

  if (R <= all[0].s) return all[0].p;
  if (R >= all[all.length - 1].s) return all[all.length - 1].p;
  for (let i = 0; i < all.length - 1; i++) {
    const lo = all[i], hi = all[i + 1];
    if (R >= lo.s && R <= hi.s) {
      const t = hi.s === lo.s ? 1 : (R - lo.s) / (hi.s - lo.s);
      return Math.max(0, Math.min(100, Math.round(lo.p + t * (hi.p - lo.p))));
    }
  }
  return null;
}
/* 적어둔 백분위가 있으면 그걸 쓰고, 없으면 등급컷으로 잡은 값을 쓴다 */
function percentileOf(r) {
  if (r.percentile !== null && r.percentile !== undefined) return { v: r.percentile, guess: false };
  const g = estimatePercentile(r.gradeCuts, r.rawScore, r.subject);
  return g === null ? { v: null, guess: false } : { v: g, guess: true };
}

/* ====== 등급컷으로 표준점수 잡기 ======
   등급컷마다 대응하는 z 값이 정해져 있다. 상위 4% 자리의 z 는 1.751 이다.
   그러니 (z, 원점수) 짝을 여러 개 놓고 직선을 맞추면 평균과 표준편차가 나오고,
   거기서 표준점수를 낸다.

   이건 성적이 정규분포를 이룬다고 가정하는 것이다. 실제로는 만점자가 몰리거나
   한쪽으로 쏠려서 어긋난다. 백분위 추정과 달리 오차에 한계가 없으니
   화면에서는 반드시 예상값이라고 밝힌다. */
const CUT_Z = [1.751, 1.227, 0.739, 0.253, -0.253, -0.739, -1.227, -1.751];
// 국어와 수학은 평균 100 표준편차 20, 탐구와 제2외국어는 평균 50 표준편차 10 을 쓴다
const stdScale = (k) => (k === "korean" || k === "math" ? { m: 100, sd: 20 } : { m: 50, sd: 10 });

function estimateStdScore(cuts, rawScore, subjectKey) {
  if (!hasPercentile(subjectKey)) return null; // 영어·한국사는 절대평가
  if (!Array.isArray(cuts) || rawScore === null || rawScore === undefined || rawScore === "") return null;
  const R = Number(rawScore);
  if (!isFinite(R)) return null;

  const zs = [], ss = [];
  cuts.forEach((c, i) => {
    const v = Number(c);
    if (c === null || c === undefined || c === "" || !isFinite(v)) return;
    if (i < CUT_Z.length) { zs.push(CUT_Z[i]); ss.push(v); }
  });
  if (zs.length < 2) return null; // 점이 둘은 있어야 직선을 그린다

  const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
  const zbar = mean(zs), sbar = mean(ss);
  let num = 0, den = 0;
  for (let i = 0; i < zs.length; i++) {
    num += (zs[i] - zbar) * (ss[i] - sbar);
    den += (zs[i] - zbar) * (zs[i] - zbar);
  }
  if (den === 0) return null;
  const sd = num / den;          // 원점수 기준 표준편차
  if (!isFinite(sd) || sd <= 0) return null;
  const avg = sbar - sd * zbar;  // 원점수 기준 평균

  const sc = stdScale(subjectKey);
  const out = Math.round(sc.m + sc.sd * ((R - avg) / sd));
  return isFinite(out) ? Math.max(0, out) : null;
}
function stdScoreOf(r) {
  if (r.stdScore !== null && r.stdScore !== undefined) return { v: r.stdScore, guess: false };
  const g = estimateStdScore(r.gradeCuts, r.rawScore, r.subject);
  return g === null ? { v: null, guess: false } : { v: g, guess: true };
}

/* 이 카테고리로 몇 회차까지 기록했는지 보고 다음 회차를 미리 골라준다 */
function suggestRound(records, cat) {
  let max = 0;
  (records || []).forEach((r) => {
    const s = String(r.examName || "");
    if (s.indexOf(cat + " ") !== 0) return;
    const m = s.slice(cat.length + 1).match(/^(\d+)회$/);
    if (m) max = Math.max(max, Number(m[1]));
  });
  return max ? String(max + 1) : "";
}

/* ====== 수능 날짜 ======
   해마다 11월 셋째 주 목요일입니다. 발표된 날짜가 다르면 SUNEUNG_FIXED 를 고치세요. */
const SUNEUNG_FIXED = "2026-11-19";
function thirdThursday(year) {
  const d = new Date(year, 10, 1);
  const shift = (4 - d.getDay() + 7) % 7; // 목요일 = 4
  return new Date(year, 10, 1 + shift + 14);
}
function nextSuneung() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const fixed = new Date(SUNEUNG_FIXED + "T00:00:00");
  if (fixed >= today) return fixed;
  let y = today.getFullYear();
  let d = thirdThursday(y);
  if (d < today) d = thirdThursday(y + 1);
  return d;
}
const dayGap = (to) => {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  return Math.round((to - a) / 86400000);
};

/* ====== 작은 도구들 ====== */
const pad2 = (n) => String(n).padStart(2, "0");
const hhmmss = (sec) => {
  const s = Math.max(0, Math.floor(sec));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return (h > 0 ? h + ":" : "") + pad2(m) + ":" + pad2(s % 60);
};
const minText = (sec) => {
  if (sec === null || sec === undefined || sec === "") return "";
  const m = Math.round(Number(sec) / 60);
  return m >= 60 ? Math.floor(m / 60) + "시간 " + (m % 60) + "분" : m + "분";
};
const todayStr = () => {
  const d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
};
const fmtDay = (s) => {
  if (!s) return "";
  const [y, m, d] = String(s).split("-");
  const cur = String(new Date().getFullYear());
  return (y === cur ? "" : y + ". ") + Number(m) + "월 " + Number(d) + "일";
};
const numOrNull = (v) => (v === "" || v === null || v === undefined ? null : Number(v));
const parseWrong = (s) =>
  String(s || "")
    .split(/[^0-9]+/)
    .filter(Boolean)
    .map(Number)
    .filter((n) => n > 0 && n <= 100)
    .filter((n, i, a) => a.indexOf(n) === i)
    .sort((a, b) => a - b);
const gradeColor = (g) => {
  if (!g) return "var(--tx3)";
  if (g <= 2) return "var(--ok)";
  if (g <= 4) return "var(--pri)";
  if (g <= 6) return "var(--warn)";
  return "var(--danger)";
};

const TAB_PATH = { home: "/", timer: "/timer", records: "/records", stats: "/stats", account: "/account" };
const PATH_TAB = {};
Object.keys(TAB_PATH).forEach((k) => { PATH_TAB[TAB_PATH[k]] = k; });
function parsePath() {
  try {
    const p = (String(window.location.pathname || "").replace(/\/+$/, "")) || "/";
    if (p === "/") return "home";
    return PATH_TAB[p] || "home";
  } catch (e) { return "home"; }
}
function pushUrl(path) {
  try { if (window.location.pathname !== path) window.history.pushState({}, "", path); } catch (e) {}
}

/* ====== 저장소 ======
   Supabase 키가 있으면 서버에, 없으면 이 기기에 저장합니다.
   화면은 어느 쪽인지 몰라도 되도록 같은 모양으로 감쌉니다. */
const LS_REC = "sn-records";
const LS_CAT = "sn-categories";
const LS_SET = "sn-settings";
const readLS = (key) => {
  try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) { return []; }
};
const writeLS = (key, rows) => {
  try { localStorage.setItem(key, JSON.stringify(rows)); } catch (e) {}
};
const readLocal = () => readLS(LS_REC);
const writeLocal = (rows) => writeLS(LS_REC, rows);
const newId = () => "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const mapRecord = (r) => ({
  id: r.id,
  examName: r.exam_name || "",
  examDate: r.exam_date || "",
  subject: r.subject || "korean",
  detail: r.detail || "",
  rawScore: r.raw_score === null || r.raw_score === undefined ? null : Number(r.raw_score),
  stdScore: r.std_score === null || r.std_score === undefined ? null : Number(r.std_score),
  percentile: r.percentile === null || r.percentile === undefined ? null : Number(r.percentile),
  grade: r.grade === null || r.grade === undefined ? null : Number(r.grade),
  wrongNos: r.wrong_nos || [],
  gradeCuts: r.grade_cuts || [],
  durationSec: r.duration_sec === null || r.duration_sec === undefined ? null : Number(r.duration_sec),
  memo: r.memo || "",
  createdAt: r.created_at ? Date.parse(r.created_at) : Date.now(),
});
const toRow = (v) => ({
  exam_name: v.examName, exam_date: v.examDate, subject: v.subject, detail: v.detail || "",
  raw_score: v.rawScore, std_score: v.stdScore, percentile: v.percentile, grade: v.grade,
  wrong_nos: v.wrongNos || [], grade_cuts: v.gradeCuts || null,
  duration_sec: v.durationSec, memo: v.memo || "",
});
/* 표가 아직 없을 때 Supabase 가 주는 응답. 기다린다고 낫는 게 아니라서
   "잠시 뒤에 다시" 라고 하면 안 된다. schema.sql 을 실행해야 한다 */
const isMissingTable = (e) =>
  !!e && (e.code === "PGRST205" || /Could not find the table|schema cache/i.test(e.message || ""));
// 열이 아직 없을 때 (schema.sql 을 다시 실행해야 한다)
const isMissingColumn = (e) =>
  !!e && (e.code === "PGRST204" || e.code === "42703" || /Could not find the '.*' column/i.test(e.message || ""));
const mapCategory = (r) => ({
  id: r.id, name: r.name || "",
  subject: r.subject || null, // 비어 있으면 전 과목
  createdAt: r.created_at ? Date.parse(r.created_at) : 0,
});
const sortRecords = (rows) =>
  rows.slice().sort((a, b) => (a.examDate === b.examDate ? b.createdAt - a.createdAt : (a.examDate < b.examDate ? 1 : -1)));

const store = {
  async list(userId) {
    if (!HAS_SB) return sortRecords(readLocal().map(mapRecord));
    if (!userId) return [];
    const { data, error } = await sb.from("exam_records").select("*").eq("user_id", userId);
    if (error) throw error;
    return sortRecords((data || []).map(mapRecord));
  },
  async add(userId, v) {
    if (!HAS_SB) {
      const rows = readLocal();
      const row = { ...toRow(v), id: newId(), created_at: new Date().toISOString() };
      rows.push(row); writeLocal(rows);
      return mapRecord(row);
    }
    const { data, error } = await sb.from("exam_records").insert({ ...toRow(v), user_id: userId }).select().single();
    if (error) throw error;
    return mapRecord(data);
  },
  async update(id, v) {
    if (!HAS_SB) {
      const rows = readLocal().map((r) => (r.id === id ? { ...r, ...toRow(v) } : r));
      writeLocal(rows);
      return mapRecord(rows.find((r) => r.id === id));
    }
    const { data, error } = await sb.from("exam_records").update(toRow(v)).eq("id", id).select().single();
    if (error) throw error;
    return mapRecord(data);
  },
  async remove(id) {
    if (!HAS_SB) { writeLocal(readLocal().filter((r) => r.id !== id)); return; }
    const { error } = await sb.from("exam_records").delete().eq("id", id);
    if (error) throw error;
  },

  /* ---- 내가 추가한 시험 카테고리 ---- */
  async listCategories(userId) {
    const sortCat = (rows) => rows.slice().sort((a, b) => a.createdAt - b.createdAt);
    if (!HAS_SB) return sortCat(readLS(LS_CAT).map(mapCategory));
    if (!userId) return [];
    const { data, error } = await sb.from("exam_categories").select("*").eq("user_id", userId);
    if (error) throw error;
    return sortCat((data || []).map(mapCategory));
  },
  async addCategory(userId, name, subject) {
    if (!HAS_SB) {
      const rows = readLS(LS_CAT);
      const row = { id: newId(), name, subject: subject || null, created_at: new Date().toISOString() };
      rows.push(row); writeLS(LS_CAT, rows);
      return mapCategory(row);
    }
    const { data, error } = await sb.from("exam_categories")
      .insert({ name, subject: subject || null, user_id: userId }).select().single();
    if (error) throw error;
    return mapCategory(data);
  },
  async removeCategory(id) {
    if (!HAS_SB) { writeLS(LS_CAT, readLS(LS_CAT).filter((r) => r.id !== id)); return; }
    const { error } = await sb.from("exam_categories").delete().eq("id", id);
    if (error) throw error;
  },
  async renameCategory(id, name) {
    if (!HAS_SB) {
      const rows = readLS(LS_CAT).map((r) => (r.id === id ? { ...r, name } : r));
      writeLS(LS_CAT, rows);
      return mapCategory(rows.find((r) => r.id === id));
    }
    const { data, error } = await sb.from("exam_categories").update({ name }).eq("id", id).select().single();
    if (error) throw error;
    return mapCategory(data);
  },
  // 카테고리 이름을 바꾸면 그 이름으로 남긴 기록도 따라가야 한다
  async setRecordName(id, examName) {
    if (!HAS_SB) {
      const rows = readLocal().map((r) => (r.id === id ? { ...r, exam_name: examName } : r));
      writeLocal(rows);
      return;
    }
    const { error } = await sb.from("exam_records").update({ exam_name: examName }).eq("id", id);
    if (error) throw error;
  },

  /* ---- 개인 설정 (탐구로 무슨 과목을 보는지) ---- */
  async getSettings(userId) {
    const empty = { tamgu1: "", tamgu2: "" };
    if (!HAS_SB) return { ...empty, ...(readLS(LS_SET)[0] || {}) };
    if (!userId) return empty;
    const { data, error } = await sb.from("profiles").select("tamgu1,tamgu2").eq("id", userId).maybeSingle();
    if (error) throw error;
    return { tamgu1: (data && data.tamgu1) || "", tamgu2: (data && data.tamgu2) || "" };
  },
  async saveSettings(userId, v) {
    if (!HAS_SB) { writeLS(LS_SET, [v]); return v; }
    const { error } = await sb.from("profiles").update({ tamgu1: v.tamgu1 || null, tamgu2: v.tamgu2 || null }).eq("id", userId);
    if (error) throw error;
    return v;
  },
};

/* ====== 공통 화면 조각 ====== */
function Ring({ ratio, color, size = 232, stroke = 14, children }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, ratio)));
  return (
    <div className="ring" style={{ width: size, height: size }}>
      <svg width={size} height={size}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--line)" strokeWidth={stroke} />
        <circle
          cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off}
          style={{ transition: "stroke-dashoffset .3s linear, stroke .3s" }}
        />
      </svg>
      <div className="mid">{children}</div>
    </div>
  );
}

function SubjectBadge({ subject }) {
  const s = subjectOf(subject);
  return <span className="badge" style={{ background: s.color }}>{subjectName(subject)}</span>;
}

function Modal({ title, onClose, children }) {
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };
  }, []);
  return (
    <div className="modal" onClick={onClose}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontWeight: 800, fontSize: 18, letterSpacing: "-0.5px" }}>{title}</div>
          <button className="btn sm" style={{ marginLeft: "auto" }} onClick={onClose}>닫기</button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ====== 로그인 ====== */
function AuthSheet({ onClose, onLogin, onSignup }) {
  const [mode, setMode] = useState("login");
  const [id, setId] = useState("");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setErr("");
    if (!id.trim()) return setErr("아이디를 입력해 주세요.");
    if (pw.length < 6) return setErr("비밀번호는 여섯 자 이상으로 정해 주세요.");
    if (mode === "signup" && pw !== pw2) return setErr("비밀번호가 서로 달라요.");
    setBusy(true);
    const r = mode === "login" ? await onLogin(id, pw) : await onSignup(id, pw);
    setBusy(false);
    if (r && r.error) setErr(r.error);
  };

  return (
    <Modal title={mode === "login" ? "로그인" : "회원가입"} onClose={onClose}>
      <div className="fld">
        <label>아이디</label>
        <input className="in" value={id} autoCapitalize="none" autoCorrect="off"
          onChange={(e) => setId(e.target.value)} placeholder="영문이나 숫자로" />
      </div>
      <div className="fld">
        <label>비밀번호</label>
        <input className="in" type="password" value={pw} onChange={(e) => setPw(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && mode === "login") submit(); }} placeholder="여섯 자 이상" />
      </div>
      {mode === "signup" && (
        <div className="fld">
          <label>비밀번호 확인</label>
          <input className="in" type="password" value={pw2} onChange={(e) => setPw2(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") submit(); }} />
        </div>
      )}
      {err && <div className="err">{err}</div>}
      <button className="btn pri wide" disabled={busy} onClick={submit}>
        {busy ? "잠시만요…" : mode === "login" ? "로그인" : "가입하고 시작하기"}
      </button>
      <button className="btn wide" style={{ marginTop: 9 }} onClick={() => { setErr(""); setMode(mode === "login" ? "signup" : "login"); }}>
        {mode === "login" ? "아직 계정이 없어요" : "이미 계정이 있어요"}
      </button>
    </Modal>
  );
}

const TIMER_KEY = "sn-timer";
function beep(times) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    for (let i = 0; i < times; i++) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880;
      const t0 = ctx.currentTime + i * 0.28;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      o.start(t0); o.stop(t0 + 0.24);
    }
    setTimeout(() => { try { ctx.close(); } catch (e) {} }, times * 300 + 400);
  } catch (e) {}
}

function Timer({ initialSubject, onRecord }) {
  const [subject, setSubject] = useState(initialSubject || "korean");
  const [custom, setCustom] = useState("");
  const [total, setTotal] = useState(subjectOf(initialSubject || "korean").minutes * 60);
  const [endsAt, setEndsAt] = useState(null);   // 돌아가는 중이면 끝나는 시각
  const [left, setLeft] = useState(subjectOf(initialSubject || "korean").minutes * 60);
  const [done, setDone] = useState(false);
  const notified = useRef({});
  const wake = useRef(null);

  const s = subjectOf(subject);
  const running = endsAt !== null;

  /* 새로고침해도 이어서 돌아가게 남겨둔다 */
  useEffect(() => {
    try {
      const raw = localStorage.getItem(TIMER_KEY);
      if (!raw) return;
      const v = JSON.parse(raw);
      if (!v || !v.endsAt) return;
      const rest = Math.round((v.endsAt - Date.now()) / 1000);
      if (rest <= 0) { localStorage.removeItem(TIMER_KEY); return; }
      setSubject(v.subject); setTotal(v.total); setEndsAt(v.endsAt); setLeft(rest);
    } catch (e) {}
  }, []);

  useEffect(() => {
    if (!running) return;
    const tick = () => {
      const rest = Math.round((endsAt - Date.now()) / 1000);
      setLeft(Math.max(0, rest));
      [600, 300, 60].forEach((mark) => {
        if (rest <= mark && rest > mark - 2 && !notified.current[mark]) {
          notified.current[mark] = true;
          beep(1);
        }
      });
      if (rest <= 0) {
        setEndsAt(null); setDone(true);
        try { localStorage.removeItem(TIMER_KEY); } catch (e) {}
        beep(3);
        try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]); } catch (e) {}
      }
    };
    tick();
    const t = setInterval(tick, 250);
    return () => clearInterval(t);
  }, [running, endsAt]);

  /* 화면이 꺼지면 시험 도중에 시간을 못 본다 */
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        if (running && navigator.wakeLock && !wake.current) {
          wake.current = await navigator.wakeLock.request("screen");
        }
      } catch (e) {}
      if (!alive) return;
    })();
    if (!running && wake.current) {
      try { wake.current.release(); } catch (e) {}
      wake.current = null;
    }
    return () => { alive = false; };
  }, [running]);

  const pickSubject = (k) => {
    if (running) return;
    setSubject(k); setCustom("");
    const sec = subjectOf(k).minutes * 60;
    setTotal(sec); setLeft(sec); setDone(false);
  };
  const applyCustom = (v) => {
    setCustom(v);
    if (v === "") { // 비우면 고른 과목의 제한 시간으로 되돌린다
      const sec = subjectOf(subject).minutes * 60;
      setTotal(sec); setLeft(sec); setDone(false);
      return;
    }
    const m = Number(v);
    if (m > 0 && m <= 300) { setTotal(m * 60); setLeft(m * 60); setDone(false); }
  };
  const start = () => {
    notified.current = {};
    const at = Date.now() + left * 1000;
    setEndsAt(at); setDone(false);
    try { localStorage.setItem(TIMER_KEY, JSON.stringify({ subject, total, endsAt: at })); } catch (e) {}
  };
  const pause = () => {
    setEndsAt(null);
    try { localStorage.removeItem(TIMER_KEY); } catch (e) {}
  };
  const reset = () => {
    setEndsAt(null); setLeft(total); setDone(false); notified.current = {};
    try { localStorage.removeItem(TIMER_KEY); } catch (e) {}
  };

  const ratio = total > 0 ? left / total : 0;
  const cls = left <= 60 ? "danger" : left <= 300 ? "warn" : "";
  const color = left <= 60 ? "var(--danger)" : left <= 300 ? "var(--warn)" : s.color;

  return (
    <div className="wrap">
      <div className="h1">모의고사 타이머</div>
      <p className="sub">과목을 고르면 실제 시험과 같은 시간으로 맞춰져요.</p>

      <div className="sec">
        <div className="chips">
          {SUBJECTS.map((x) => (
            <button key={x.key} className={"chip" + (x.key === subject && !custom ? " on" : "")}
              disabled={running} onClick={() => pickSubject(x.key)}>
              {subjectName(x.key)}
            </button>
          ))}
        </div>
      </div>

      <div className="card sec">
        <div className="tmr">
          <Ring ratio={ratio} color={color}>
            <div className={"clock " + cls}>{hhmmss(left)}</div>
            <div className="lbl">{custom ? "직접 맞춘 시간" : s.name}</div>
          </Ring>

          {done ? (
            <div style={{ textAlign: "center", marginBottom: 14 }}>
              <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 4 }}>시간이 다 됐어요</div>
              <div style={{ fontSize: 13, color: "var(--tx2)" }}>답안지에서 손을 떼세요.</div>
            </div>
          ) : (
            <div style={{ fontSize: 12.5, color: "var(--tx3)", marginBottom: 14, fontWeight: 600, textAlign: "center", lineHeight: 1.5 }}>
              {custom ? Math.round(total / 60) + "분" : s.minutes + "분 · " + s.count + "문항 · " + s.at}
              {running && left > 600 ? <br /> : ""}
              {running && left > 600 ? "10분 전에 알려드려요" : ""}
            </div>
          )}

          <div className="row" style={{ width: "100%" }}>
            {!running ? (
              <button className="btn pri" style={{ flex: 2 }} onClick={start}>
                {left === total ? "시작" : done ? "다시" : "이어서"}
              </button>
            ) : (
              <button className="btn" style={{ flex: 2 }} onClick={pause}>일시정지</button>
            )}
            <button className="btn" onClick={reset}>처음으로</button>
          </div>

          <button className="btn wide" style={{ marginTop: 9 }}
            onClick={() => onRecord({ subject, durationSec: total - left })}>
            점수 기록하기
          </button>
        </div>
      </div>

      <div className="sec">
        <div className="sec-t">시간 직접 맞추기</div>
        <div className="card pad">
          <div className="row" style={{ alignItems: "center" }}>
            <input className="in" type="number" inputMode="numeric" value={custom} disabled={running}
              onChange={(e) => applyCustom(e.target.value)} placeholder="분" />
            <div style={{ flex: 2, fontSize: 12.5, color: "var(--tx3)", lineHeight: 1.5 }}>
              실전보다 짧게 잡고 푸는 연습에 써요. 최대 300분까지 돼요.
            </div>
          </div>
        </div>
      </div>

      <div className="banner">
        <span>🔔</span>
        <span>10분, 5분, 1분 남았을 때 소리로 알려드려요. 소리가 안 나면 아이폰 무음 스위치를 확인해 주세요.</span>
      </div>
    </div>
  );
}

function ExamPicker({ subject, categories, records, onClose, onDone, onAddCategory }) {
  const [q, setQ] = useState("");
  const [roundFor, setRoundFor] = useState(""); // 회차를 적는 중인 카테고리
  const [roundText, setRoundText] = useState("");
  const [yearFor, setYearFor] = useState("");   // 연도를 고르는 중인 카테고리
  const [adding, setAdding] = useState(false);
  const [newCat, setNewCat] = useState("");
  const [newCatAll, setNewCatAll] = useState(false);
  const [catErr, setCatErr] = useState("");
  const s = subjectOf(subject);

  const mine = categories.filter((c) => !c.subject || c.subject === subject).map((c) => c.name);
  const hit = (n) => !q.trim() || n.toLowerCase().indexOf(q.trim().toLowerCase()) !== -1;
  const baseHits = BASE_CATEGORIES.filter(hit);
  const mineHits = mine.filter(hit);

  const choose = (cat) => {
    if (isBaseCat(cat)) return setYearFor(cat);
    // 지난 기록을 보고 다음 회차를 미리 넣어둔다. 그대로 확인만 누르면 되게
    setRoundText(suggestRound(records, cat));
    setRoundFor(cat);
  };
  const submitCat = async () => {
    const name = newCat.trim();
    setCatErr("");
    if (!name) return setCatErr("이름을 적어 주세요.");
    if (isBaseCat(name) || mine.indexOf(name) !== -1) return setCatErr("이미 있는 카테고리예요.");
    const r = await onAddCategory(name, newCatAll ? null : subject);
    if (r && r.error) return setCatErr(r.error);
    setNewCat(""); setAdding(false); setNewCatAll(false);
    setRoundText(""); setRoundFor(name);
  };

  if (yearFor) {
    const thisYear = String(new Date().getFullYear());
    return (
      <Modal title={yearFor + " · 몇 년도 시험인가요"} onClose={() => setYearFor("")}>
        <div className="chips">
          {EXAM_YEARS.map((y) => (
            <button key={y} className={"chip" + (y === thisYear ? " on" : "")}
              onClick={() => onDone({ cat: yearFor, year: y, round: "", orphan: "" })}>
              {y}
            </button>
          ))}
        </div>
        <p className="sub" style={{ marginTop: 12, marginBottom: 0, fontSize: 12.5 }}>
          푼 날짜가 아니라 그 시험이 치러진 해예요. 옛날 기출을 풀었으면 그 해를 고르세요.
        </p>
      </Modal>
    );
  }

  if (roundFor) {
    const suggested = suggestRound(records, roundFor);
    const done = () => {
      const n = String(roundText).trim().replace(/[^0-9]/g, "");
      onDone({ cat: roundFor, year: "", round: n, orphan: "" });
    };
    return (
      <Modal title={roundFor + " · 몇 회차인가요"} onClose={() => setRoundFor("")}>
        <div className="row">
          <input className="in" type="number" inputMode="numeric" autoFocus value={roundText}
            onChange={(e) => setRoundText(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") done(); }}
            placeholder="회차" />
          <button className="btn pri" style={{ flex: "none" }} onClick={done}>확인</button>
        </div>
        <button className="btn wide" style={{ marginTop: 9 }}
          onClick={() => onDone({ cat: roundFor, year: "", round: "", orphan: "" })}>
          회차 없이
        </button>
        <p className="sub" style={{ marginTop: 12, marginBottom: 0, fontSize: 12.5 }}>
          {suggested
            ? Number(suggested) - 1 + "회까지 기록하셨어요. " + suggested + "회를 미리 넣어뒀으니 그대로 확인을 누르면 돼요."
            : "회차가 몇 번이든 적을 수 있어요."}
        </p>
      </Modal>
    );
  }

  return (
    <Modal title="시험 고르기" onClose={onClose}>
      <input className="in" value={q} onChange={(e) => setQ(e.target.value)} placeholder="이름으로 찾기" />

      {baseHits.length > 0 && (
        <div className="sec">
          <div className="sec-t">평가원·교육청</div>
          <div className="chips">
            {baseHits.map((n) => <button key={n} className="chip" onClick={() => choose(n)}>{n}</button>)}
          </div>
        </div>
      )}

      {mineHits.length > 0 && (
        <div className="sec">
          <div className="sec-t">사설 모의고사</div>
          <div className="chips">
            {mineHits.map((n) => <button key={n} className="chip" onClick={() => choose(n)}>{n}</button>)}
          </div>
        </div>
      )}

      {baseHits.length === 0 && mineHits.length === 0 && (
        <div className="empty" style={{ padding: 28 }}>찾는 시험이 없어요.<br />아래에서 새로 만들 수 있어요.</div>
      )}

      <div className="sec">
        {!adding ? (
          <button className="btn wide" onClick={() => { setAdding(true); setNewCat(q.trim()); setCatErr(""); }}>
            + 새 카테고리 만들기
          </button>
        ) : (
          <div>
            <div className="row">
              <input className="in" value={newCat} autoFocus
                onChange={(e) => setNewCat(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") submitCat(); }}
                placeholder="예: 이감, 더프리미엄" />
              <button className="btn pri sm" style={{ flex: "none" }} onClick={submitCat}>만들기</button>
              <button className="btn sm" style={{ flex: "none" }} onClick={() => { setAdding(false); setCatErr(""); }}>취소</button>
            </div>
            <div className="chips" style={{ marginTop: 8 }}>
              <button className={"chip" + (newCatAll ? "" : " on")} onClick={() => setNewCatAll(false)}>{subjectName(subject)} 에서만</button>
              <button className={"chip" + (newCatAll ? " on" : "")} onClick={() => setNewCatAll(true)}>모든 과목에서</button>
            </div>
            {catErr && <div className="err" style={{ marginTop: 7 }}>{catErr}</div>}
            <div style={{ fontSize: 12, color: "var(--tx3)", marginTop: 7, marginLeft: 3, lineHeight: 1.5 }}>
              회차는 넣지 마세요. 만들고 나서 따로 고르게 돼요.
            </div>
          </div>
        )}
      </div>
    </Modal>
  );
}

/* invert 는 등급처럼 숫자가 작을수록 좋은 값에 쓴다. 1등급이 위로 간다 */
function LineChart({ points, color, min, max, invert }) {
  const W = 300, H = 130, P = 14;
  if (points.length === 0) return null;
  const top = max || Math.max.apply(null, points.map((p) => p.v)) || 1;
  const bottom = min || 0;
  const span = top - bottom || 1;
  const x = (i) => (points.length === 1 ? W / 2 : P + (i * (W - P * 2)) / (points.length - 1));
  const y = (v) => invert
    ? P + ((v - bottom) / span) * (H - P * 2)
    : H - P - ((v - bottom) / span) * (H - P * 2);
  const d = points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  // 채우는 면의 바닥. 뒤집힌 그래프는 위쪽이 바닥이다
  const base = invert ? P : H - P;
  const area = d + " L" + x(points.length - 1).toFixed(1) + " " + base + " L" + x(0).toFixed(1) + " " + base + " Z";
  return (
    <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: 130, display: "block" }}>
      <path d={area} fill={color} opacity="0.10" />
      <path d={d} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p, i) => (
        <g key={i}>
          <circle cx={x(i)} cy={y(p.v)} r="4" fill="var(--card)" stroke={color} strokeWidth="2.5" />
          <text x={x(i)} y={invert ? y(p.v) + 17 : y(p.v) - 9} textAnchor="middle" fontSize="10" fontWeight="700" fill="var(--tx2)">{p.v}</text>
        </g>
      ))}
    </svg>
  );
}

function Stats({ auth, records, openAuth }) {
  const used = SUBJECTS.filter((s) => records.some((r) => r.subject === s.key));
  const [pick, setPick] = useState(null);
  const key = pick && used.some((u) => u.key === pick) ? pick : (used[0] && used[0].key);
  const s = key ? subjectOf(key) : null;

  /* 원점수는 시험마다 난이도가 달라서 흐름을 보기 어렵다.
     백분위는 남들과 견준 자리라 좋지만, 사설 모의고사는 표본이 적어 집계를 못 내고
     예상 등급컷만 주는 곳이 많다. 그래서 기출과 사설을 함께 이어서 볼 수 있는 건
     등급뿐이다. 등급을 먼저 둔다.
     등급은 숫자가 작을수록 좋아서 그래프를 뒤집는다. */
  const METRICS = [
    { key: "grade", name: "등급", get: (r) => r.grade, min: 1, max: 9, invert: true },
    { key: "percentile", name: "백분위", get: (r) => percentileOf(r).v, min: 0, max: 100, invert: false },
    { key: "stdScore", name: "표준점수", get: (r) => stdScoreOf(r).v, min: null, max: null, invert: false },
    { key: "rawScore", name: "원점수", get: (r) => r.rawScore, min: 0, max: null, invert: false },
  ];
  const [metricKey, setMetricKey] = useState("grade");

  const mine = useMemo(
    () => records.filter((r) => r.subject === key).slice().reverse(),
    [records, key]
  );
  const has = (mm) => mine.filter((r) => mm.get(r) !== null && mm.get(r) !== undefined).length;
  // 고른 것에 값이 없으면 값이 있는 쪽으로 넘어간다. 빈 그래프를 보여줄 이유가 없다
  const asked = METRICS.find((x) => x.key === metricKey) || METRICS[0];
  const m = has(asked) > 0 ? asked : (METRICS.find((x) => has(x) > 0) || asked);

  const vals = mine.filter((r) => m.get(r) !== null && m.get(r) !== undefined);
  const avg = (arr, f) => (arr.length ? Math.round((arr.reduce((a, b) => a + f(b), 0) / arr.length) * 10) / 10 : null);
  const best = vals.length
    ? (m.invert ? Math.min.apply(null, vals.map(m.get)) : Math.max.apply(null, vals.map(m.get)))
    : null;
  const avgVal = avg(vals, m.get);
  const missing = mine.length - vals.length;
  // 등급컷으로 잡은 값이 섞였는지
  const guessCount = vals.filter((r) =>
    (m.key === "percentile" && percentileOf(r).guess) || (m.key === "stdScore" && stdScoreOf(r).guess)
  ).length;
  /* 표준점수는 100 언저리에서 오르내려서 0부터 그리면 변화가 안 보인다.
     값 주변만 잘라 보여준다. 원점수는 과목 만점을 위쪽으로 쓴다. */
  const nums = vals.map(m.get);
  const lo = m.min !== null ? m.min : Math.max(0, Math.min.apply(null, nums) - 5);
  const hi = m.max !== null ? m.max
    : (m.key === "rawScore" ? s.max : Math.max.apply(null, nums) + 5);

  const wrongTop = useMemo(() => {
    const m = {};
    mine.forEach((r) => (r.wrongNos || []).forEach((n) => { m[n] = (m[n] || 0) + 1; }));
    return Object.keys(m).map(Number).map((n) => ({ n, c: m[n] })).filter((x) => x.c >= 2)
      .sort((a, b) => b.c - a.c || a.n - b.n).slice(0, 8);
  }, [mine]);

  if (HAS_SB && !auth) {
    return (
      <div className="wrap">
        <div className="h1">성적 흐름</div>
        <div className="card pad sec">
          <p className="sub" style={{ marginBottom: 12 }}>로그인하면 지금까지의 점수가 어떻게 움직였는지 볼 수 있어요.</p>
          <button className="btn pri wide" onClick={openAuth}>로그인하기</button>
        </div>
      </div>
    );
  }
  if (!key) {
    return (
      <div className="wrap">
        <div className="h1">성적 흐름</div>
        <div className="card sec"><div className="empty">기록이 두 개 이상 쌓이면<br />점수가 어떻게 움직였는지 보여드려요.</div></div>
      </div>
    );
  }

  return (
    <div className="wrap">
      <div className="h1">성적 흐름</div>
      <p className="sub">과목을 골라서 점수가 어떻게 움직였는지 봐요.</p>

      <div className="chips sec">
        {used.map((x) => (
          <button key={x.key} className={"chip" + (x.key === key ? " on" : "")} onClick={() => setPick(x.key)}>{subjectName(x.key)}</button>
        ))}
      </div>

      <div className="chips" style={{ marginTop: 10 }}>
        {METRICS.map((x) => (
          <button key={x.key} className={"chip" + (x.key === m.key ? " on" : "")}
            disabled={has(x) === 0} style={has(x) === 0 ? { opacity: 0.4 } : null}
            onClick={() => setMetricKey(x.key)}>
            {x.name}
          </button>
        ))}
      </div>

      <div className="card pad sec">
        <div style={{ display: "flex", gap: 18, marginBottom: 12 }}>
          <div className="nm-i">
            <b style={{ fontSize: 20, fontWeight: 800 }}>{mine.length}</b>
            <span style={{ fontSize: 11, color: "var(--tx3)", fontWeight: 600 }}>응시</span>
          </div>
          <div className="nm-i">
            <b style={{ fontSize: 20, fontWeight: 800, color: m.key === "grade" ? gradeColor(avgVal) : "inherit" }}>{avgVal ?? "—"}</b>
            <span style={{ fontSize: 11, color: "var(--tx3)", fontWeight: 600 }}>평균 {m.name}</span>
          </div>
          <div className="nm-i">
            <b style={{ fontSize: 20, fontWeight: 800, color: m.key === "grade" ? gradeColor(best) : "inherit" }}>{best ?? "—"}</b>
            <span style={{ fontSize: 11, color: "var(--tx3)", fontWeight: 600 }}>최고 {m.name}</span>
          </div>
        </div>
        {vals.length > 0 ? (
          <LineChart points={vals.map((r) => ({ v: m.get(r) }))} color={s.color}
            min={lo} max={hi} invert={m.invert} />
        ) : (
          <div className="empty" style={{ padding: 24 }}>{m.name}를 적은 기록이 없어요.</div>
        )}
        <div style={{ fontSize: 11.5, color: "var(--tx3)", textAlign: "center", marginTop: 4, fontWeight: 600, lineHeight: 1.6 }}>
          왼쪽이 예전, 오른쪽이 최근이에요{m.invert ? " · 위로 갈수록 좋은 등급이에요" : ""}
          {guessCount > 0 && <br />}
          {guessCount > 0 ? "그중 " + guessCount + "개는 등급컷으로 잡은 예상값이에요" : ""}
          {missing > 0 && <br />}
          {missing > 0 ? m.name + "를 알 수 없는 기록 " + missing + "개는 빠졌어요" : ""}
        </div>
      </div>

      {wrongTop.length > 0 && (
        <div className="sec">
          <div className="sec-t">자주 틀리는 문항</div>
          <div className="card pad">
            <div className="chips">
              {wrongTop.map((w) => (
                <span key={w.n} className="chip" style={{ color: "var(--danger)", borderColor: "var(--danger)" }}>
                  {w.n}번 · {w.c}회
                </span>
              ))}
            </div>
            <p className="sub" style={{ marginTop: 10, marginBottom: 0, fontSize: 12.5 }}>
              같은 자리에서 두 번 넘게 틀린 문항이에요. 그 번호대가 어떤 유형인지 살펴보면 좋아요.
            </p>
          </div>
        </div>
      )}

      <div className="sec">
        <div className="sec-t">{subjectName(key)} 기록</div>
        <div className="card pad">
          <table className="tbl">
            <thead><tr><th>날짜</th><th>시험</th><th>백분위</th><th>원점수</th><th>등급</th></tr></thead>
            <tbody>
              {mine.slice().reverse().map((r) => (
                <tr key={r.id}>
                  <td style={{ color: "var(--tx3)", whiteSpace: "nowrap" }}>{fmtDay(r.examDate)}</td>
                  <td style={{ fontWeight: 600 }}>{r.examName}</td>
                  <td style={percentileOf(r).guess ? { color: "var(--tx3)" } : null}>
                    {percentileOf(r).v === null ? "—" : percentileOf(r).v + (percentileOf(r).guess ? "*" : "")}
                  </td>
                  <td>{r.rawScore === null ? "—" : r.rawScore}</td>
                  <td style={{ fontWeight: 800, color: gradeColor(r.grade) }}>{r.grade || "—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* 계정 화면의 카테고리 한 줄. 이름을 바꾸거나 지운다 */
function CategoryRow({ cat, used, first, onRename, onRemove }) {
  const [editing, setEditing] = useState(false);
  const [name, setName] = useState(cat.name);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true);
    const r = await onRename(cat, name);
    setBusy(false);
    if (r && r.error) return setErr(r.error);
    setErr(""); setEditing(false);
  };

  if (editing) {
    return (
      <div style={{ padding: "11px 0", borderTop: first ? "none" : "1px solid var(--line)" }}>
        <div className="row">
          <input className="in" value={name} autoFocus
            onChange={(e) => setName(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") submit(); }} />
          <button className="btn pri sm" style={{ flex: "none" }} disabled={busy} onClick={submit}>저장</button>
          <button className="btn sm" style={{ flex: "none" }}
            onClick={() => { setEditing(false); setName(cat.name); setErr(""); }}>취소</button>
        </div>
        {err && <div className="err" style={{ marginTop: 7 }}>{err}</div>}
        {used > 0 && (
          <div style={{ fontSize: 12, color: "var(--tx3)", marginTop: 7, marginLeft: 3, lineHeight: 1.5 }}>
            이 이름으로 남긴 기록 {used}개도 같이 바뀌어요.
          </div>
        )}
      </div>
    );
  }

  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 8,
      padding: "11px 0", borderTop: first ? "none" : "1px solid var(--line)",
    }}>
      <span style={{ flex: 1, minWidth: 0, overflow: "hidden" }}>
        <span style={{ fontWeight: 600, fontSize: 14.5, display: "block", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {cat.name}
        </span>
        <span style={{ fontSize: 11.5, color: "var(--tx3)", fontWeight: 600 }}>
          {cat.subject ? subjectName(cat.subject) : "모든 과목"} · 기록 {used}개
        </span>
      </span>
      <button className="btn sm" style={{ flex: "none" }} onClick={() => setEditing(true)}>이름</button>
      <button className="btn sm danger" style={{ flex: "none" }} onClick={() => onRemove(cat)}>지우기</button>
    </div>
  );
}

          <div className="card pad">
            <p className="sub" style={{ marginBottom: 12, fontSize: 12.5 }}>
              지정하면 앱 곳곳에서 탐구 1, 탐구 2 대신 이 과목 이름이 나와요.
            </p>
            {[["tamgu1", "탐구 1"], ["tamgu2", "탐구 2"]].map(([k, label]) => (
              <div className="fld" key={k}>
                <label>{label}</label>
                <select className="in" value={settings[k] || ""} onChange={(e) => pickTamgu(k, e.target.value)}>
                  <option value="">고르지 않음</option>
                  {TAMGU_CHOICES.map((g) => (
                    <optgroup key={g.group} label={g.group}>
                      {g.items.map((n) => <option key={n} value={n}>{n}</option>)}
                    </optgroup>
                  ))}
                </select>
              </div>
            ))}
            {setErr && <div className="err">{setErr}</div>}
          </div>
        </div>
      )}

      {canEdit && (
        <div className="sec">
          <div className="sec-t">내가 만든 시험 카테고리</div>
          <div className="card pad">
            {categories.length === 0 ? (
              <p className="sub" style={{ margin: 0 }}>
                아직 없어요. 기록할 때 시험 고르는 칸에서 새 카테고리 만들기로 추가하면 여기에 모여요.
              </p>
            ) : (
              <div className="lst" style={{ gap: 0 }}>
                {categories.map((c, i) => (
                  <CategoryRow key={c.id} cat={c} used={usedCount(c.name)} first={i === 0}
                    onRename={onRenameCategory} onRemove={onRemoveCategory} />
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      <div className="sec">
        <div className="sec-t">화면</div>
        <div className="card pad">
          <div className="chips">
            {[["light", "밝게"], ["dark", "어둡게"]].map(([k, n]) => (
              <button key={k} className={"chip" + (theme === k ? " on" : "")} onClick={() => setTheme(k)}>{n}</button>
            ))}
          </div>
        </div>
      </div>

      <div className="sec">
        <div className="sec-t">수능 시간표</div>
        <div className="card pad">
          <table className="tbl">
            <thead><tr><th>교시</th><th>과목</th><th>시간</th><th>문항</th></tr></thead>
            <tbody>
              {SUBJECTS.map((s, i) => (
                <tr key={s.key}>
                  <td style={{ color: "var(--tx3)" }}>{i + 1}</td>
                  <td style={{ fontWeight: 700 }}>{subjectName(s.key)}</td>
                  <td style={{ color: "var(--tx2)", whiteSpace: "nowrap" }}>{s.at}</td>
                  <td style={{ color: "var(--tx2)" }}>{s.count}개</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <p className="sub" style={{ textAlign: "center", marginTop: 22, fontSize: 12, color: "var(--tx3)" }}>수능 대비 v{APP_VERSION}</p>
    </div>
  );
}

/* ====== 앱 ====== */
function App() {
  const [tab, setTab] = useState(parsePath);
  const [auth, setAuth] = useState(null);
  const [records, setRecords] = useState([]);
  const [categories, setCategories] = useState([]);
  const [settings, setSettings] = useState({ tamgu1: "", tamgu2: "" });
  const [loading, setLoading] = useState(true);
  const [authOpen, setAuthOpen] = useState(false);
  const [form, setForm] = useState(null);
  const [timerSubject, setTimerSubject] = useState(null);
  const [theme, setThemeState] = useState(() => {
    try { return document.documentElement.dataset.theme || "light"; } catch (e) { return "light"; }
  });

  const setTheme = (t) => {
    setThemeState(t);
    try {
      document.documentElement.dataset.theme = t;
      localStorage.setItem("sn-theme", t);
      const mc = document.querySelector('meta[name="theme-color"]');
      if (mc) mc.setAttribute("content", t === "dark" ? "#0f131b" : "#eef2fa");
    } catch (e) {}
  };

  const go = (t, opt) => {
    if (opt && opt.subject) setTimerSubject(opt.subject);
    setTab(t);
    pushUrl(TAB_PATH[t] || "/");
    try { window.scrollTo(0, 0); } catch (e) {}
  };

  useEffect(() => {
    const onPop = () => setTab(parsePath());
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  const reload = useCallback(async (userId) => {
    try {
      setRecords(await store.list(userId));
    } catch (e) {
      console.warn("기록을 불러오지 못했습니다:", e);
      setRecords([]);
    }
    try {
      setCategories(await store.listCategories(userId));
    } catch (e) {
      // 카테고리를 못 불러와도 기본 목록으로 기록은 남길 수 있어야 한다
      console.warn("카테고리를 불러오지 못했습니다:", e);
      setCategories([]);
    }
    try {
      const v = await store.getSettings(userId);
      applyTamguNames(v);
      setSettings(v);
    } catch (e) {
      // 설정을 못 읽으면 탐구 1, 탐구 2 로 그냥 보여준다
      console.warn("설정을 불러오지 못했습니다:", e);
      applyTamguNames(null);
      setSettings({ tamgu1: "", tamgu2: "" });
    }
  }, []);

  useEffect(() => {
    let alive = true;
    (async () => {
      if (!HAS_SB) {
        await reload(null);
        if (alive) setLoading(false);
        return;
      }
      try {
        const { data } = await sb.auth.getSession();
        const u = data && data.session ? data.session.user : null;
        if (u) {
          const me = { id: u.id, username: (u.user_metadata && u.user_metadata.username) || String(u.email || "").split("@")[0] };
          if (alive) setAuth(me);
          await reload(u.id);
        }
      } catch (e) {
        console.warn("세션 확인 실패:", e);
      }
      if (alive) setLoading(false);
    })();
    return () => { alive = false; };
  }, [reload]);

  const onLogin = async (id, pw) => {
    if (!HAS_SB) return { error: "지금은 체험 모드예요." };
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email: emailOf(id), password: padPw(pw) });
      if (error || !data || !data.user) return { error: "아이디 또는 비밀번호가 올바르지 않아요." };
      const me = { id: data.user.id, username: id.trim() };
      setAuth(me); setAuthOpen(false);
      reload(data.user.id);
      return {};
    } catch (e) {
      return { error: "로그인 중 문제가 생겼어요. 잠시 뒤에 다시 해주세요." };
    }
  };
  const onSignup = async (id, pw) => {
    if (!HAS_SB) return { error: "지금은 체험 모드예요." };
    try {
      const { data, error } = await sb.auth.signUp({
        email: emailOf(id), password: padPw(pw),
        options: { data: { username: id.trim() } },
      });
      if (error) {
        const dup = /registered|already|exists|duplicate/i.test(error.message || "");
        return { error: dup ? "이미 쓰고 있는 아이디예요." : error.message };
      }
      if (!data || !data.session || !data.user) {
        return { error: "가입은 됐어요. 로그인이 안 되면 Supabase에서 이메일 확인 설정을 꺼주세요." };
      }
      setAuth({ id: data.user.id, username: id.trim() });
      setAuthOpen(false);
      reload(data.user.id);
      return {};
    } catch (e) {
      return { error: "가입 중 문제가 생겼어요. 잠시 뒤에 다시 해주세요." };
    }
  };
  const onLogout = async () => {
    try { if (HAS_SB) await sb.auth.signOut(); } catch (e) {}
    setAuth(null); setRecords([]); setCategories([]); go("home");
  };

  const saveRecord = async (v) => {
    try {
      if (form && form.id) {
        const updated = await store.update(form.id, v);
        setRecords((p) => sortRecords(p.map((r) => (r.id === form.id ? updated : r))));
      } else {
        const added = await store.add(auth ? auth.id : null, v);
        setRecords((p) => sortRecords([added].concat(p)));
      }
      setForm(null);
      return {};
    } catch (e) {
      console.warn("저장 실패:", e);
      return { error: "저장하지 못했어요. 잠시 뒤에 다시 해주세요." };
    }
  };
  const addCategory = async (name, subject) => {
    try {
      const added = await store.addCategory(auth ? auth.id : null, name, subject);
      setCategories((p) => p.concat([added]));
      return {};
    } catch (e) {
      console.warn("카테고리 추가 실패:", e);
      if (isMissingTable(e)) return { error: "카테고리를 담아둘 자리가 아직 없어요. schema.sql 을 실행해 주세요." };
      const dup = e && (e.code === "23505" || /duplicate|unique/i.test(e.message || ""));
      if (dup) return { error: "이미 있는 카테고리예요." };
      // 무엇 때문에 막혔는지 화면에서 바로 보여야 고칠 수 있다
      const why = (e && (e.message || e.hint)) || "";
      return { error: "추가하지 못했어요." + (why ? " " + why : "") };
    }
  };
  /* 카테고리 이름을 바꾸면 그 이름으로 남긴 기록도 같이 바꾼다.
     안 그러면 흐름 화면에서 같은 시험이 둘로 갈라진다 */
  const renameCategory = async (c, name) => {
    const next = String(name || "").trim();
    if (!next) return { error: "이름을 적어 주세요." };
    if (next === c.name) return {};
    if (isBaseCat(next)) return { error: "이미 있는 카테고리예요." };
    if (categories.some((x) => x.id !== c.id && x.name === next && x.subject === c.subject))
      return { error: "이미 있는 카테고리예요." };
    try {
      const updated = await store.renameCategory(c.id, next);
      const touched = records.filter((r) => r.examName === c.name || r.examName.indexOf(c.name + " ") === 0);
      for (const r of touched) {
        await store.setRecordName(r.id, next + r.examName.slice(c.name.length));
      }
      setCategories((p) => p.map((x) => (x.id === c.id ? updated : x)));
      setRecords((p) => p.map((r) =>
        touched.some((t) => t.id === r.id) ? { ...r, examName: next + r.examName.slice(c.name.length) } : r
      ));
      return {};
    } catch (e) {
      console.warn("이름 바꾸기 실패:", e);
      const why = (e && (e.message || e.hint)) || "";
      return { error: "바꾸지 못했어요." + (why ? " " + why : "") };
    }
  };
  const saveSettings = async (v) => {
    try {
      await store.saveSettings(auth ? auth.id : null, v);
      applyTamguNames(v);
      setSettings({ ...v });
      return {};
    } catch (e) {
      console.warn("설정 저장 실패:", e);
      if (isMissingColumn(e)) return { error: "설정을 담아둘 자리가 아직 없어요. schema.sql 을 실행해 주세요." };
      const why = (e && (e.message || e.hint)) || "";
      return { error: "저장하지 못했어요." + (why ? " " + why : "") };
    }
  };
  const removeCategory = async (c) => {
    const used = records.filter((r) => r.examName === c.name || r.examName.indexOf(c.name + " ") === 0).length;
    const msg = used
      ? `'${c.name}' 을 지울까요? 이 카테고리로 남긴 기록 ${used}개는 그대로 있어요.`
      : `'${c.name}' 을 지울까요?`;
    if (!window.confirm(msg)) return;
    try {
      await store.removeCategory(c.id);
      setCategories((p) => p.filter((x) => x.id !== c.id));
    } catch (e) {
      window.alert("지우지 못했어요. 잠시 뒤에 다시 해주세요.");
    }
  };

  const deleteRecord = async (id) => {
    try {
      await store.remove(id);
      setRecords((p) => p.filter((r) => r.id !== id));
      setForm(null);
    } catch (e) {
      window.alert("지우지 못했어요. 잠시 뒤에 다시 해주세요.");
    }
  };

  const needLogin = () => {
    if (HAS_SB && !auth) { setAuthOpen(true); return true; }
    return false;
  };
  const openNew = (over) => { if (needLogin()) return; setForm(emptyForm(over)); };
  const openEdit = (r) => setForm({
    id: r.id, examName: r.examName, examDate: r.examDate, subject: r.subject, detail: r.detail,
    rawScore: r.rawScore === null ? "" : String(r.rawScore),
    stdScore: r.stdScore === null ? "" : String(r.stdScore),
    percentile: r.percentile === null ? "" : String(r.percentile),
    grade: r.grade === null ? "" : String(r.grade),
    wrong: (r.wrongNos || []).join(" "),
    cuts: [0, 1, 2, 3, 4, 5, 6, 7].map((i) => {
      const c = (r.gradeCuts || [])[i];
      return c === null || c === undefined ? "" : String(c);
    }),
    durationSec: r.durationSec, memo: r.memo,
  });

  if (loading) {
    return (
      <div className="sp-splash">
        <div className="lg">D</div>
        <div style={{ fontWeight: 700, fontSize: 15 }}>불러오는 중…</div>
        <div className="sp" />
      </div>
    );
  }

  const NAV = [
    ["home", "홈", "🏠"],
    ["timer", "타이머", "⏱"],
    ["records", "기록", "📋"],
    ["stats", "흐름", "📈"],
    ["account", "계정", "👤"],
  ];

  return (
    <div>
      <header className="hd">
        <div className="hd-in">
          <div className="logo">D</div>
          <div className="nm">수능 대비</div>
          <div className="rt">
            {HAS_SB && !auth && <button className="btn sm pri" onClick={() => setAuthOpen(true)}>로그인</button>}
            {auth && <span style={{ fontSize: 12.5, color: "var(--tx2)", fontWeight: 700 }}>{auth.username}</span>}
          </div>
        </div>
      </header>

      {tab === "home" && <Home auth={auth} records={records} go={go} openAuth={() => setAuthOpen(true)} />}
      {tab === "timer" && (
        <Timer
          initialSubject={timerSubject}
          onRecord={(v) => openNew({ subject: v.subject, durationSec: v.durationSec || null })}
        />
      )}
      {tab === "records" && (
        <Records auth={auth} records={records} openAuth={() => setAuthOpen(true)}
          onNew={() => openNew()} onEdit={openEdit} />
      )}
      {tab === "stats" && <Stats auth={auth} records={records} openAuth={() => setAuthOpen(true)} />}
      {tab === "account" && (
        <Account auth={auth} records={records} categories={categories} settings={settings}
          openAuth={() => setAuthOpen(true)} onLogout={onLogout}
          onRemoveCategory={removeCategory} onRenameCategory={renameCategory} onSaveSettings={saveSettings}
          theme={theme} setTheme={setTheme} />
      )}

      <nav className="nav">
        <div className="nav-in">
          {NAV.map(([k, n, ic]) => (
            <button key={k} className={tab === k ? "on" : ""} onClick={() => go(k)}>
              <span className="ic">{ic}</span>
              <span>{n}</span>
            </button>
          ))}
        </div>
      </nav>

      {authOpen && <AuthSheet onClose={() => setAuthOpen(false)} onLogin={onLogin} onSignup={onSignup} />}
      {form && (
        <RecordForm init={form} categories={categories} records={records} onClose={() => setForm(null)}
          onSave={saveRecord} onDelete={deleteRecord} onAddCategory={addCategory} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
